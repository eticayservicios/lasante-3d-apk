# 8 GB RAM: heap moderado + menos workers paralelos (evita OOM / cierre de sesión)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

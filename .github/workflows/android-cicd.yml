name: Android CI/CD

on:
  push:
    branches:
      - main        # producción
      - develop     # staging
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Build APK Debug (rama develop)
        if: github.ref == 'refs/heads/develop'
        run: ./gradlew assembleDebug

      - name: Build APK Release (rama main)
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/app/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Obtener versión de la app
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          BUILD=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION ($BUILD)"

      - name: Deploy a S3 - Debug (develop)
        if: github.ref == 'refs/heads/develop'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD=${{ steps.version.outputs.build }}
          APK_NAME="LaSante-App-TV-${VERSION}-${BUILD}.apk"
          LATEST_APK_NAME="LaSante-App-TV.apk"
          CONTENT_DISPOSITION='attachment; filename="LaSante-App-TV.apk"'

          # Subir APK
          aws s3 cp app/build/outputs/apk/debug/app-debug.apk \
            s3://$S3_BUCKET/android/debug/$APK_NAME \
            --content-type application/vnd.android.package-archive \
            --content-disposition "$CONTENT_DISPOSITION"

          # Actualizar latest
          aws s3 cp app/build/outputs/apk/debug/app-debug.apk \
            s3://$S3_BUCKET/android/debug/$LATEST_APK_NAME \
            --content-type application/vnd.android.package-archive \
            --content-disposition "$CONTENT_DISPOSITION"

          # Generar manifest JSON con metadata
          cat > manifest.json << EOF
          {
            "version": "$VERSION",
            "build": "$BUILD",
            "branch": "develop",
            "environment": "staging",
            "filename": "$APK_NAME",
            "url": "https://$S3_BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/android/debug/$APK_NAME",
            "latest_url": "https://$S3_BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/android/debug/$LATEST_APK_NAME",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF

          aws s3 cp manifest.json s3://$S3_BUCKET/android/debug/manifest.json

          echo "✅ APK debug subido: $APK_NAME"

      - name: Deploy a S3 - Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD=${{ steps.version.outputs.build }}
          APK_NAME="LaSante-App-TV-${VERSION}-${BUILD}.apk"
          LATEST_APK_NAME="LaSante-App-TV.apk"
          CONTENT_DISPOSITION='attachment; filename="LaSante-App-TV.apk"'

          # Subir APK release
          aws s3 cp app/build/outputs/apk/release/app-release.apk \
            s3://$S3_BUCKET/android/release/$APK_NAME \
            --content-type application/vnd.android.package-archive \
            --content-disposition "$CONTENT_DISPOSITION"

          # Actualizar latest
          aws s3 cp app/build/outputs/apk/release/app-release.apk \
            s3://$S3_BUCKET/android/release/$LATEST_APK_NAME \
            --content-type application/vnd.android.package-archive \
            --content-disposition "$CONTENT_DISPOSITION"

          # Generar manifest JSON
          cat > manifest.json << EOF
          {
            "version": "$VERSION",
            "build": "$BUILD",
            "branch": "main",
            "environment": "production",
            "filename": "$APK_NAME",
            "url": "https://$S3_BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/android/release/$APK_NAME",
            "latest_url": "https://$S3_BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/android/release/$LATEST_APK_NAME",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF

          aws s3 cp manifest.json s3://$S3_BUCKET/android/release/manifest.json

          echo "✅ APK release subido: $APK_NAME"

      - name: Subir APK como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
